name: Deploy to Hugging Face Space

# 触发方式：手动触发
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码（获取仓库中的 app.py 和 requirements.txt）
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装必要的 Python 库
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install huggingface_hub

      # 3. 上传文件到你的 Hugging Face Space
      - name: Upload files to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}  # 引用你设置的密码变量
        run: |
          python -c "
          from huggingface_hub import HfApi
          import os

          # 你的 Space 完整信息
          repo_id = 'micsir/qwen25se'
          # 本地文件路径（在仓库根目录）
          local_files = ['app.py', 'requirements.txt']

          api = HfApi(token=os.environ.get('HF_TOKEN'))

          print(f'正在将文件上传到 Space: {repo_id}')
          for file_path in local_files:
              if os.path.exists(file_path):
                  print(f'  上传 {file_path} ...')
                  api.upload_file(
                      path_or_fileobj=file_path,
                      path_in_repo=file_path,
                      repo_id=repo_id,
                      repo_type='space',
                      # 如果希望覆盖已存在的文件，需要设置此参数
                      # commit_message=f'Update {file_path}'
                  )
                  print(f'  {file_path} 上传成功！')
              else:
                  print(f'警告：文件 {file_path} 未找到，跳过上传。')
          print('部署完成！请等待 Hugging Face Space 构建。')
          "